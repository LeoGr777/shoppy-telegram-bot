[project]
name = "shoppy"
version = "2.0.0"
description = "A collaborative shopping list bot for Telegram."
authors = [{ name = "Leo Grund", email = "leogrund10@gmail.com" }]
readme = ".github/README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = ["python-telegram-bot~=22.8"]

[project.scripts]
shoppy = "shoppy.__main__:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
