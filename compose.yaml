# Local build. The production stack lives in the stacks repo.
services:
  shoppy:
    build: .
    image: shoppy-telegram-bot:dev
    container_name: shoppy
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/shopping_list.db
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
